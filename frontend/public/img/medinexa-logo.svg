<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <linearGradient id="mnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>
  
  <!-- Icon Mark: Hexagonal shield with cross and neural dots -->
  <g transform="translate(4, 5)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#mnGradient)" />
    <!-- Medical Cross -->
    <path d="M20 11 V29 M11 20 H29" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <!-- Neural Nodes -->
    <circle cx="11" cy="11" r="2.2" fill="#ffffff" opacity="0.9" />
    <circle cx="29" cy="11" r="2.2" fill="#ffffff" opacity="0.9" />
    <circle cx="11" cy="29" r="2.2" fill="#ffffff" opacity="0.9" />
    <circle cx="29" cy="29" r="2.2" fill="#ffffff" opacity="0.9" />
    <!-- Connecting neural lines -->
    <path d="M12.5 12.5 L17 17 M27.5 12.5 L23 17 M12.5 27.5 L17 23 M27.5 27.5 L23 23" stroke="#ffffff" stroke-width="1.2" opacity="0.75" />
  </g>
  
  <!-- Typography -->
  <text x="56" y="27" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Medi<tspan fill="#0d9488">Nexa</tspan></text>
  <text x="56" y="39" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748b" letter-spacing="0.6">AI HEALTHCARE PLATFORM</text>
</svg>
