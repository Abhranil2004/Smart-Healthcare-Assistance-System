server:
  port: ${PORT:8081}

spring:
  application:
    name: hospital-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:healthcare_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET:HealthcareSystemSecureJwtSecretKeyMustBeAtLeast256BitsLongForHmacSha256Security1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

logging:
  level:
    root: INFO
    com.smarthealthcare.hospital: DEBUG
